name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: '22'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cache-key: ${{ steps.cache-key.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute dependency cache key
        id: cache-key
        run: echo "value=${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

  quality:
    name: ${{ matrix.check.name }}
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.check.timeout }}
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: TypeScript build
            command: npm run build
            timeout: 10
          - name: Unit and integration tests
            command: npm test -- --coverage=false
            timeout: 15
          - name: OpenAPI contract tests
            command: npm run test:contract
            timeout: 10
          - name: Performance regression gate
            command: npm run performance:check
            timeout: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

  security:
    name: Security review gates
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  release-readiness:
    name: Release readiness
    needs:
      - quality
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture canary deployment plan
        run: |
          cat <<'PLAN' >> "$GITHUB_STEP_SUMMARY"
          ## Blue-green and canary release gate
          - Build artifacts are eligible only after all parallel quality and security jobs pass.
          - Deploy to the inactive color first, then shift 5%, 25%, 50%, and 100% of traffic.
          - Abort promotion when P99 latency is >= 100ms, error rate increases, or uptime SLO burn exceeds policy.
          PLAN
