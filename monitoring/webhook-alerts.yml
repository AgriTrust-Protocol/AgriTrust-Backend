groups:
  - name: webhook-delivery
    rules:
      - alert: WebhookDeadLetters
        expr: increase(webhook_delivery_attempts_total{result="dead_letter"}[10m]) > 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: Webhook deliveries are moving to dead letter queue
      - alert: WebhookQueueDepthGrowing
        expr: deriv(webhook_queue_depth[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Webhook delivery queue depth is growing
