groups:
  - name: job-scheduler-leases
    rules:
      - alert: JobSchedulerLeaseClaimLatencyHigh
        expr: histogram_quantile(0.99, sum(rate(job_scheduler_lease_claim_duration_seconds_bucket[5m])) by (le)) > 0.1
        for: 10m
        labels:
          severity: page
        annotations:
          summary: Job scheduler lease claim latency exceeds 100ms P99
      - alert: JobSchedulerLeaseClaimErrors
        expr: increase(job_scheduler_lease_claims_total{result="error"}[5m]) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Job scheduler lease claim errors detected
      - alert: JobSchedulerLeaseBacklogGrowing
        expr: job_scheduler_leases_active > 0 and increase(job_scheduler_leases_active[15m]) > 100
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: Active scheduler leases are growing unexpectedly
