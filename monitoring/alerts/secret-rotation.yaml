groups:
  - name: secret-rotation
    rules:
      - alert: SecretRotationFailures
        expr: increase(secret_rotation_attempts_total{result="failure"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Secret rotation failure for {{ $labels.target }}
          description: A database credential or API key rotation failed and requires security review.
      - alert: SecretRotationStale
        expr: secret_rotation_staleness_seconds > 86400
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Secret rotation stale for {{ $labels.target }}
          description: The target has not completed a successful rotation in more than 24 hours.
