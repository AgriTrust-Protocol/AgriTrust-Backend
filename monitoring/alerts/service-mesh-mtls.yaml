groups:
  - name: agritrust-service-mesh-mtls
    rules:
      - alert: ServiceMeshMutualTlsPolicyMissing
        expr: absent(istio_requests_total{destination_service_name="agritrust-backend",connection_security_policy="mutual_tls"})
        for: 5m
        labels:
          severity: critical
          service: agritrust-backend
        annotations:
          summary: AgriTrust backend is not receiving mTLS-protected mesh traffic
          description: Verify PeerAuthentication is STRICT and DestinationRule uses ISTIO_MUTUAL.
      - alert: ServiceMeshCriticalPathP99TooHigh
        expr: histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{destination_service_name="agritrust-backend"}[5m])) by (le)) > 100
        for: 10m
        labels:
          severity: page
          service: agritrust-backend
        annotations:
          summary: AgriTrust mesh request p99 latency exceeds 100ms
          description: Canary analysis must pause or roll back until p99 is below the SLO.
      - alert: ServiceMeshAvailabilityBudgetBurn
        expr: (sum(rate(istio_requests_total{destination_service_name="agritrust-backend",response_code=~"5.."}[5m])) / sum(rate(istio_requests_total{destination_service_name="agritrust-backend"}[5m]))) > 0.0001
        for: 5m
        labels:
          severity: page
          service: agritrust-backend
        annotations:
          summary: AgriTrust mesh 5xx rate is burning the 99.99% availability budget
          description: Check rollout status, mesh sidecar health, and upstream dependencies.
